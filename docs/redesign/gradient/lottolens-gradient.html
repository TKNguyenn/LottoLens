<!doctype html>
<html lang="vi" data-theme="dark" data-finish="gradient">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LottoLens — Gradient study</title>
<link rel="icon" href="../assets/generated/07-ticket-gold.ico">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --page:#F1F1F3;
  --bg:#FFFFFF;
  --bg-sunken:#FAFAFA;
  --bg-elevated:#FFFFFF;
  --fg:#101014;
  --fg-muted:#5F5F6B;
  --fg-subtle:#8C8C97;
  --border:#E3E3E8;
  --border-strong:#D2D2DA;

  --red:#C81E33;
  --red-hover:#A8162A;
  --red-bright:#F0394E;
  --red-soft:#FCEDEF;
  --red-ink:#8E1224;

  --gold:#A9761D;
  --gold-soft:#FBF3E2;
  --green:#0F7A57;
  --green-soft:#E8F6F0;
  --amber:#9A6A0B;
  --amber-soft:#FDF4E3;
  --blue:#2563EB;

  --ball-bg:linear-gradient(158deg,#FFFFFF 0%,#F2F2F5 100%);
  --ball-ring:#E3E3E8;
  --ball-hit:linear-gradient(158deg,#E03248 0%,#B0142B 100%);
  --ball-gold:linear-gradient(158deg,#F6D593 0%,#D9A03C 100%);

  --r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:14px; --r-xl:18px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(16,16,20,.05);
  --sh-2:0 2px 6px rgba(16,16,20,.06), 0 1px 2px rgba(16,16,20,.04);
  --sh-3:0 12px 32px -8px rgba(16,16,20,.14), 0 2px 8px rgba(16,16,20,.06);
  --sh-red:0 6px 18px -6px rgba(200,30,51,.45);

  --sans:"Segoe UI Variable Text","Segoe UI",Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono","SF Mono",ui-monospace,Consolas,"Courier New",monospace;
}
[data-theme="dark"]{
  --page:#06060A;
  --bg:#0F0F13;
  --bg-sunken:#0A0A0D;
  --bg-elevated:#16161C;
  --fg:#F4F4F6;
  --fg-muted:#A0A0AC;
  --fg-subtle:#6F6F7C;
  --border:#232329;
  --border-strong:#33333D;

  --red:#FF3B4E;
  --red-hover:#FF5F70;
  --red-bright:#FF6B7B;
  --red-soft:rgba(255,59,78,.12);
  --red-ink:#FF8A96;

  --gold:#F2C05C;
  --gold-soft:rgba(242,192,92,.12);
  --green:#34D399;
  --green-soft:rgba(52,211,153,.12);
  --amber:#F0B84E;
  --amber-soft:rgba(240,184,78,.12);
  --blue:#7AA2FF;

  --ball-bg:linear-gradient(158deg,#26262E 0%,#1A1A20 100%);
  --ball-ring:#34343E;
  --ball-hit:linear-gradient(158deg,#FF4A5C 0%,#C11228 100%);
  --ball-gold:linear-gradient(158deg,#F8DCA0 0%,#C9902F 100%);

  --sh-1:0 1px 2px rgba(0,0,0,.5);
  --sh-2:0 2px 8px rgba(0,0,0,.55);
  --sh-3:0 18px 44px -12px rgba(0,0,0,.75), 0 2px 10px rgba(0,0,0,.4);
  --sh-red:0 6px 22px -6px rgba(255,59,78,.42);
}

*{box-sizing:border-box}
svg:not([width]){width:1em;height:1em;flex:0 0 auto}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--page);color:var(--fg);
  font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"cv05" 1;
}
::selection{background:var(--red);color:#fff}
h1,h2,h3,h4{margin:0;letter-spacing:-.02em;font-weight:650}
p{margin:0}
a{color:var(--red);text-decoration:none}
a:hover{text-decoration:underline}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ============================================================
   SHELL
   ============================================================ */
.topbar{
  position:sticky;top:0;z-index:60;
  display:flex;align-items:center;gap:14px;
  padding:10px 22px;
  background:color-mix(in srgb,var(--page) 82%,transparent);
  backdrop-filter:blur(18px) saturate(140%);
  border-bottom:1px solid var(--border);
}
.topbar .mark{width:26px;height:26px;flex:0 0 auto}
.topbar .name{font-weight:650;font-size:14px;letter-spacing:-.01em}
.topbar .sub{color:var(--fg-subtle);font-size:12px;margin-left:-6px}
.topbar nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.topbar nav a{
  color:var(--fg-muted);font-size:12.5px;font-weight:500;
  padding:6px 11px;border-radius:var(--r-pill);
  text-decoration:none;transition:background .14s,color .14s;
}
.topbar nav a:hover{background:var(--bg);color:var(--fg);text-decoration:none}
.topbar nav a.on{background:var(--red-soft);color:var(--red-ink);font-weight:600}
.tbtn{
  display:inline-flex;align-items:center;gap:7px;
  height:32px;padding:0 12px;border-radius:var(--r-pill);
  border:1px solid var(--border);background:var(--bg);color:var(--fg);
  font:inherit;font-size:12.5px;font-weight:550;cursor:pointer;
  transition:.15s;white-space:nowrap;
}
.tbtn:hover{border-color:var(--border-strong);box-shadow:var(--sh-1)}
.tbtn svg{width:15px;height:15px}

.shell{max-width:1440px;margin:0 auto;padding:0 22px 90px}

/* hero */
.hero{padding:56px 0 34px;border-bottom:1px solid var(--border)}
.hero .eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:11.5px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;
  color:var(--red);margin-bottom:18px;
}
.hero .eyebrow::before{content:"";width:22px;height:2px;background:var(--red);border-radius:2px}
.hero h1{font-size:46px;line-height:1.05;letter-spacing:-.035em;max-width:820px}
.hero h1 em{font-style:normal;color:var(--red)}
.hero .lede{margin-top:16px;max-width:660px;color:var(--fg-muted);font-size:15px;line-height:1.62}
.hero .meta{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.tag{
  font-size:11.5px;font-weight:550;color:var(--fg-muted);
  border:1px solid var(--border);background:var(--bg);
  padding:4px 10px;border-radius:var(--r-pill);
}
.tag b{color:var(--fg);font-weight:600}

.section{padding:56px 0 8px;scroll-margin-top:64px}
.section > header{margin-bottom:26px;display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
.section > header h2{font-size:26px;letter-spacing:-.03em}
.section > header p{color:var(--fg-muted);font-size:13.5px;max-width:640px;margin-top:6px}
.section > header .idx{
  font-family:var(--mono);font-size:11px;color:var(--fg-subtle);
  border:1px solid var(--border);border-radius:var(--r-xs);padding:2px 7px;margin-bottom:6px;
}

/* ============================================================
   APP FRAME (mockup)
   ============================================================ */
.app{
  border:1px solid var(--border-strong);
  border-radius:var(--r-xl);
  background:var(--bg-sunken);
  box-shadow:var(--sh-3);
  overflow:hidden;
  display:grid;grid-template-columns:236px minmax(0,1fr);
  min-height:840px;
}
[data-theme="dark"] .app{box-shadow:0 0 0 1px rgba(255,255,255,.04), var(--sh-3)}

/* titlebar */
.titlebar{
  grid-column:1/-1;display:flex;align-items:center;gap:10px;
  height:40px;padding:0 12px 0 14px;
  background:var(--bg-sunken);border-bottom:1px solid var(--border);
  user-select:none;
}
.titlebar .tl{width:11px;height:11px;border-radius:50%;background:var(--border-strong);opacity:.6}
.titlebar .tl:nth-child(2){background:var(--border-strong)}
.titlebar .tname{
  margin-left:8px;font-size:12px;font-weight:550;color:var(--fg-muted);
  display:flex;align-items:center;gap:7px;
}
.titlebar .tname svg{width:15px;height:15px;border-radius:4px}
.titlebar .wctl{margin-left:auto;display:flex;gap:16px;color:var(--fg-subtle);font-size:11px}
.titlebar .wctl span{width:10px;height:10px;position:relative;opacity:.75}
.titlebar .wctl span::before{content:"";position:absolute;inset:4px 0;border-top:1.4px solid currentColor}
.titlebar .wctl span:nth-child(2)::before{inset:1px;border:1.4px solid currentColor}
.titlebar .wctl span:nth-child(3)::before{inset:0;border:0;background:
  linear-gradient(45deg,transparent 44%,currentColor 44%,currentColor 56%,transparent 56%)}

/* rail */
.rail{
  overflow:hidden;
  border-right:1px solid var(--border);
  background:var(--bg);
  display:flex;flex-direction:column;
  padding:18px 12px 14px;gap:4px;
  min-width:0;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 18px}
.brand svg{width:30px;height:30px;flex:0 0 auto;border-radius:8px}
.brand .bt{line-height:1.2;min-width:0}
.brand .bt b{display:block;font-size:13.5px;font-weight:650;letter-spacing:-.015em}
.brand .bt span{display:block;font-size:10.5px;color:var(--fg-subtle);letter-spacing:.01em}
.rail .group{
  font-size:10px;font-weight:650;letter-spacing:.1em;text-transform:uppercase;
  color:var(--fg-subtle);padding:10px 10px 6px;
}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{
  display:flex;align-items:center;gap:10px;width:100%;
  height:36px;padding:0 10px;border:0;border-radius:var(--r-sm);
  background:transparent;color:var(--fg-muted);
  font:inherit;font-size:13px;font-weight:500;text-align:left;cursor:pointer;
  position:relative;transition:background .13s,color .13s;
}
.nav button svg{width:17px;height:17px;flex:0 0 auto;stroke-width:1.7}
.nav button:hover{background:var(--bg-sunken);color:var(--fg)}
.nav button.on{background:var(--red-soft);color:var(--red-ink);font-weight:600}
.nav button.on::before{
  content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:2.5px;
  background:var(--red);border-radius:0 2px 2px 0;
}
.nav button.on svg{stroke-width:2}
.nav .count{
  margin-left:auto;font-size:10.5px;font-family:var(--mono);
  background:var(--bg-sunken);border:1px solid var(--border);
  border-radius:var(--r-pill);padding:0 6px;color:var(--fg-subtle);
}
.nav button.on .count{background:var(--bg);border-color:transparent;color:var(--red-ink)}
.rail .foot{
  margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--border);
  display:flex;flex-direction:column;gap:10px;
}
.rail .foot p{font-size:10px;line-height:1.45;color:var(--fg-subtle)}
.rail .foot p b{color:var(--fg-muted);font-weight:600;display:block;margin-bottom:2px}
.themeswitch{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  height:30px;padding:0 8px 0 10px;border-radius:var(--r-sm);
  border:1px solid var(--border);background:var(--bg-sunken);
  font-size:11.5px;color:var(--fg-muted);
}
.sw{position:relative;width:30px;height:17px;border-radius:var(--r-pill);
  background:var(--border-strong);cursor:pointer;flex:0 0 auto;transition:.18s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;
  border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:.18s}
[data-theme="dark"] .sw{background:var(--red)}
[data-theme="dark"] .sw::after{transform:translateX(13px)}

/* main */
.main{
  background:var(--bg-sunken);
  display:flex;flex-direction:column;min-width:0;
}
.topline{
  height:56px;display:flex;align-items:center;gap:10px;
  padding:0 22px;border-bottom:1px solid var(--border);
  background:var(--bg);min-width:0;
}
.topline .ctx{display:flex;align-items:center;gap:8px;min-width:0}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex:0 0 auto;
  box-shadow:0 0 0 3px var(--green-soft)}
.topline .ctx b{font-size:13px;font-weight:600;white-space:nowrap}
.topline .ctx span{font-size:12px;color:var(--fg-subtle);white-space:nowrap}
.topline .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.gameselect{
  display:flex;align-items:center;gap:8px;height:32px;padding:0 8px 0 11px;
  border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg);
  font:inherit;font-size:12.5px;font-weight:550;color:var(--fg);
  cursor:pointer;transition:.14s;position:relative;
}
.gameselect:hover{border-color:var(--border-strong);box-shadow:var(--sh-1)}
.gameselect svg{width:14px;height:14px;color:var(--fg-subtle)}
.gameselect .pill{
  font-size:10px;font-family:var(--mono);padding:1px 5px;border-radius:4px;
  background:var(--red-soft);color:var(--red-ink);font-weight:600;
}
.gdrop{
  position:absolute;top:38px;right:0;z-index:40;min-width:216px;
  background:var(--bg-elevated);border:1px solid var(--border);
  border-radius:var(--r-md);box-shadow:var(--sh-3);padding:5px;display:none;
}
.gdrop.open{display:block}
.gdrop button{
  display:flex;align-items:center;gap:9px;width:100%;height:32px;padding:0 9px;
  border:0;background:transparent;border-radius:var(--r-xs);color:var(--fg);
  font:inherit;font-size:12.5px;text-align:left;cursor:pointer;
}
.gdrop button:hover{background:var(--bg-sunken)}
.gdrop button svg{width:14px;height:14px;color:var(--fg-subtle)}
.gdrop button.sel{background:var(--red-soft);color:var(--red-ink);font-weight:600}
.gdrop button.sel svg{color:currentColor}
.gdrop button small{margin-left:auto;font-size:10px;font-family:var(--mono);color:var(--fg-subtle)}

.canvas{padding:20px 22px 26px;min-width:0;flex:1;display:flex;flex-direction:column;gap:14px}
.pagehead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.pagehead h1{font-size:21px;letter-spacing:-.03em}
.pagehead p{font-size:12.5px;color:var(--fg-muted);margin-top:3px;max-width:560px}
.pagehead .acts{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:34px;padding:0 14px;border-radius:var(--r-sm);
  border:1px solid var(--border-strong);background:var(--bg);color:var(--fg);
  font:inherit;font-size:12.5px;font-weight:550;cursor:pointer;white-space:nowrap;
  transition:.14s;
}
.btn svg{width:15px;height:15px;stroke-width:1.9}
.btn:hover{background:var(--bg-sunken);border-color:var(--fg-subtle)}
.btn:active{transform:translateY(.5px)}
.btn-primary{background:var(--red);border-color:var(--red);color:#fff;box-shadow:var(--sh-red)}
.btn-primary:hover{background:var(--red-hover);border-color:var(--red-hover)}
[data-theme="dark"] .btn-primary{color:#14050A}
.btn-quiet{background:transparent;border-color:transparent;color:var(--fg-muted);padding:0 9px}
.btn-quiet:hover{background:var(--bg-sunken);color:var(--fg)}
.btn-sm{height:29px;padding:0 10px;font-size:12px;border-radius:7px}
.btn-icon{width:34px;padding:0}
.btn-icon.btn-sm{width:29px}

/* cards */
.card{
  background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:18px;min-width:0;
}
.card.flush{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h3{font-size:12.5px;font-weight:650;letter-spacing:.01em}
.card-h .hint{font-size:11px;color:var(--fg-subtle);margin-left:auto;text-align:right}
.card-h .ico{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;
  background:var(--red-soft);color:var(--red-ink);flex:0 0 auto}
.card-h .ico svg{width:13px;height:13px;stroke-width:2}
.bento{display:grid;gap:12px}
.card.stretch{display:flex;flex-direction:column}
.card.stretch > .push{margin-top:auto}
.b-2{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.b-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.b-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.b-split{grid-template-columns:minmax(0,1fr) 352px}
.span2{grid-column:span 2}

/* stat */
.stat .lbl{font-size:11px;font-weight:550;color:var(--fg-subtle);display:flex;align-items:center;gap:5px}
.stat .lbl svg{width:12px;height:12px;stroke-width:1.9;opacity:.75}
.stat .val{font-size:27px;font-weight:650;letter-spacing:-.035em;margin-top:6px;
  font-variant-numeric:tabular-nums;line-height:1.1}
.stat .val small{font-size:12px;font-weight:500;color:var(--fg-muted);letter-spacing:0;margin-left:3px}
.stat .delta{font-size:11px;margin-top:5px;color:var(--fg-subtle)}
.stat .delta b{color:var(--fg-muted);font-weight:600}
.stat .delta.up b{color:var(--red)}
.stat .delta.dn b{color:var(--green)}

.card.meta{padding:14px 16px;display:flex;flex-direction:column;gap:3px}
.card.meta .ml{font-size:10.5px;font-weight:600;color:var(--fg-subtle);display:flex;align-items:center;gap:5px;letter-spacing:.02em}
.card.meta .ml svg{width:12px;height:12px;stroke-width:2;opacity:.8}
.card.meta .mv{font-size:13px;font-weight:600;letter-spacing:-.01em;margin-top:2px;word-break:break-word}
.card.meta .mv.mono{font-family:var(--mono);font-size:11.5px;font-weight:500}
.card.meta .md{font-size:10.5px;color:var(--fg-subtle);margin-top:1px}
.card.meta .md .iconlink{font-size:10.5px}
.card.meta .md .iconlink svg{width:10px;height:10px}

.minirow{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px dashed var(--border);font-size:11.5px}
.minirow:last-of-type{border-bottom:0}
.minirow > span:first-child{font-weight:600;color:var(--fg)} .minirow > span:first-child{font-size:11.5px}
.minirow .muted{color:var(--fg-subtle);font-size:11px;flex:0 0 74px}
.minirow .nums{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--fg-muted);letter-spacing:.02em;text-align:right}

/* balls */
.balls{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.ball{
  width:42px;height:42px;border-radius:50%;flex:0 0 auto;
  display:grid;place-items:center;
  font-size:15px;font-weight:650;font-variant-numeric:tabular-nums;
  color:var(--fg);
  background:var(--ball-bg);
  border:1px solid var(--ball-ring);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), var(--sh-1);
  letter-spacing:-.02em;
}
[data-theme="dark"] .ball{box-shadow:inset 0 1px 0 rgba(255,255,255,.06), var(--sh-1)}
.ball--hit{
  background:var(--ball-hit);border-color:transparent;color:#fff;
  box-shadow:0 3px 10px -2px rgba(200,30,51,.5), inset 0 1px 0 rgba(255,255,255,.22);
}
[data-theme="dark"] .ball--hit{color:#1A0206}
.ball--gold{
  background:var(--ball-gold);border-color:transparent;color:#3A2705;
  box-shadow:0 3px 10px -2px rgba(169,118,29,.4), inset 0 1px 0 rgba(255,255,255,.4);
}
.ball--sm{width:26px;height:26px;font-size:10.5px;font-weight:600}
.ball--xs{width:22px;height:22px;font-size:9.5px;font-weight:600}
.ball--lg{width:52px;height:52px;font-size:19px;border-radius:50%}
.balls.sep .ball + .ball{margin-left:0}
.balls .sp{width:9px;height:1px;background:var(--border-strong);flex:0 0 auto}

/* pills / chips / badges */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  height:20px;padding:0 7px;border-radius:var(--r-xs);
  font-size:10.5px;font-weight:600;letter-spacing:.01em;
  background:var(--bg-sunken);border:1px solid var(--border);color:var(--fg-muted);
}
.badge svg{width:11px;height:11px;stroke-width:2.2}
.badge.red{background:var(--red-soft);border-color:transparent;color:var(--red-ink)}
.badge.gold{background:var(--gold-soft);border-color:transparent;color:var(--gold)}
.badge.green{background:var(--green-soft);border-color:transparent;color:var(--green)}
.badge.amber{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.badge.mono{font-family:var(--mono);font-weight:500;font-size:10px;letter-spacing:0}
.seg{
  display:inline-flex;padding:2px;gap:2px;border-radius:var(--r-sm);
  background:var(--bg-sunken);border:1px solid var(--border);
}
.seg button{
  height:26px;padding:0 10px;border:0;border-radius:6px;background:transparent;
  color:var(--fg-muted);font:inherit;font-size:11.5px;font-weight:550;cursor:pointer;transition:.13s;
}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--bg);color:var(--fg);box-shadow:var(--sh-1);font-weight:600}
[data-theme="dark"] .seg button.on{background:var(--bg-elevated)}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;
  border-radius:var(--r-pill);border:1px solid var(--border);background:var(--bg);
  font-size:11.5px;font-weight:550;color:var(--fg-muted);cursor:pointer;transition:.13s;
}
.chip:hover{border-color:var(--border-strong);color:var(--fg)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
[data-theme="dark"] .chip.on{color:#14050A}
.chip .n{font-family:var(--mono);font-size:10px;opacity:.7}

/* inputs */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label{font-size:11px;font-weight:600;color:var(--fg-muted);letter-spacing:.01em}
.field .desc{font-size:10.5px;color:var(--fg-subtle);line-height:1.45}
.input,.select{
  height:34px;padding:0 11px;border-radius:var(--r-sm);
  border:1px solid var(--border-strong);background:var(--bg);color:var(--fg);
  font:inherit;font-size:12.5px;width:100%;transition:.13s;min-width:0;
}
.input::placeholder{color:var(--fg-subtle)}
.input:hover,.select:hover{border-color:var(--fg-subtle)}
.input:focus,.select:focus{outline:0;border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.select{
  appearance:none;cursor:pointer;padding-right:30px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 15px) 15px, calc(100% - 10px) 15px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.inwrap{position:relative;display:flex;align-items:center}
.inwrap > svg{position:absolute;left:10px;width:14px;height:14px;color:var(--fg-subtle);pointer-events:none}
.inwrap .input{padding-left:31px}
.inwrap .suffix{
  position:absolute;right:6px;display:flex;align-items:center;gap:4px;
}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row > .field{flex:1 1 150px}

/* callout */
.callout{
  display:flex;gap:9px;padding:11px 13px;border-radius:var(--r-sm);
  background:var(--amber-soft);color:var(--amber);
  font-size:11.5px;line-height:1.5;border:1px solid transparent;
}
.callout svg{width:14px;height:14px;flex:0 0 auto;margin-top:1px;stroke-width:2}
.callout b{font-weight:650}
.callout.info{background:var(--bg-sunken);color:var(--fg-muted);border-color:var(--border)}
.callout.info svg{color:var(--fg-subtle)}
.callout.red{background:var(--red-soft);color:var(--red-ink)}

/* table */
.tblwrap{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--bg)}
.tblscroll{overflow:auto;max-height:none}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
table.tbl th{
  position:sticky;top:0;z-index:2;text-align:left;
  font-size:10.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;
  color:var(--fg-subtle);background:var(--bg-sunken);
  padding:9px 14px;border-bottom:1px solid var(--border);white-space:nowrap;
}
table.tbl td{
  padding:8px 14px;border-bottom:1px solid var(--border);
  vertical-align:middle;color:var(--fg);
}
table.tbl tbody tr:last-child td{border-bottom:0}
table.tbl tbody tr{transition:background .1s}
table.tbl tbody tr:hover{background:var(--bg-sunken)}
table.tbl td.id{font-family:var(--mono);font-weight:600;font-size:12px}
table.tbl td.muted{color:var(--fg-subtle);font-size:11.5px}
table.tbl td.r{text-align:right}
table.tbl th.r{text-align:right}
.tblfoot{
  display:flex;align-items:center;gap:10px;padding:9px 14px;
  border-top:1px solid var(--border);background:var(--bg-sunken);
  font-size:11px;color:var(--fg-subtle);
}
.tblfoot .pager{margin-left:auto;display:flex;gap:4px;align-items:center}
.tblfoot .pager button{
  width:24px;height:24px;display:grid;place-items:center;border-radius:6px;
  border:1px solid var(--border);background:var(--bg);color:var(--fg-muted);cursor:pointer;
}
.tblfoot .pager button:hover{border-color:var(--border-strong);color:var(--fg)}
.tblfoot .pager button svg{width:12px;height:12px}
.iconlink{
  display:inline-flex;align-items:center;gap:5px;color:var(--fg-muted);font-size:11.5px;
  text-decoration:none;border-bottom:1px dashed var(--border-strong);padding-bottom:1px;
}
.iconlink:hover{color:var(--red);border-color:var(--red);text-decoration:none}
.iconlink svg{width:11px;height:11px;stroke-width:2}

/* mini bar meter */
.meter{height:4px;border-radius:2px;background:var(--bg-sunken);overflow:hidden;min-width:52px}
[data-theme="dark"] .meter{background:#1E1E26}
.meter i{display:block;height:100%;background:var(--red);border-radius:2px}
.meter i.dim{background:var(--border-strong)}

/* heatmap */
.heat{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px}
.heat .cell{
  aspect-ratio:1;border-radius:7px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;cursor:pointer;
  border:1px solid transparent;transition:.12s;position:relative;
}
.heat .cell b{font-size:11.5px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1}
.heat .cell span{font-size:9px;opacity:.62;font-variant-numeric:tabular-nums;line-height:1}
.heat .cell:hover{transform:translateY(-1px);border-color:var(--border-strong)}
.heat .cell.top{box-shadow:inset 0 0 0 1.5px var(--red)}
.heat .cell.on{border-color:var(--fg)}
.legend{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--fg-subtle);margin-top:10px}
.legend .sw2{width:11px;height:11px;border-radius:3px;border:1px solid var(--border)}

/* empty state */
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:44px 20px;text-align:center;
}
.empty .ec{
  width:46px;height:46px;border-radius:var(--r-md);display:grid;place-items:center;
  background:var(--bg-sunken);border:1px solid var(--border);color:var(--fg-subtle);
}
.empty .ec svg{width:20px;height:20px;stroke-width:1.6}
.empty h4{font-size:13px;font-weight:600}
.empty p{font-size:11.5px;color:var(--fg-subtle);max-width:280px;line-height:1.5}

/* progress / status bar */
.statusbar{
  display:flex;align-items:center;gap:10px;height:34px;padding:0 14px;
  border-top:1px solid var(--border);background:var(--bg);
  font-size:11px;color:var(--fg-subtle);margin-top:auto;
}
.statusbar .pill{display:flex;align-items:center;gap:6px;color:var(--fg-muted)}
.statusbar .pill i{width:5px;height:5px;border-radius:50%;background:var(--green)}
.statusbar .grow{margin-left:auto;display:flex;align-items:center;gap:10px}
.statusbar .bar{width:90px;height:3px;border-radius:2px;background:var(--bg-sunken);overflow:hidden}
.statusbar .bar i{display:block;height:100%;width:42%;background:var(--red);border-radius:2px}
.statusbar svg{width:12px;height:12px}

/* kv rows for report */
.kv{display:flex;flex-direction:column}
.kv .r2{display:flex;gap:14px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:12px}
.kv .r2:last-child{border-bottom:0}
.kv .k{color:var(--fg-subtle);flex:0 0 148px;font-size:11.5px}
.kv .v{font-weight:550;font-variant-numeric:tabular-nums;min-width:0}
.kv .v.mono{font-weight:500;font-family:var(--mono);font-size:11.5px}

/* ticket rows */
.ticket{
  display:flex;align-items:center;gap:12px;padding:11px 14px;
  border-bottom:1px solid var(--border);transition:background .1s;
}
.ticket:last-child{border-bottom:0}
.ticket:hover{background:var(--bg-sunken)}
.ticket .n{
  width:22px;height:22px;border-radius:6px;background:var(--bg-sunken);border:1px solid var(--border);
  display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;color:var(--fg-subtle);flex:0 0 auto;
}
.ticket .tagm{margin-left:auto;display:flex;gap:6px;align-items:center;flex:0 0 auto}
.ticket .balls{flex-wrap:nowrap;gap:5px}
.ticket .balls .ball{width:24px;height:24px;font-size:10px}

/* AI streaming surface */
.answer{
  border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg-sunken);
  padding:13px 14px;font-size:12px;line-height:1.62;color:var(--fg-muted);
  min-height:104px;
}
.answer .caret{display:inline-block;width:6px;height:12px;background:var(--red);
  vertical-align:-1px;margin-left:2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.srcs{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.src{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--fg-muted)}
.src svg{width:12px;height:12px;color:var(--fg-subtle);flex:0 0 auto}
.src .d{font-size:10px;color:var(--fg-subtle);font-family:var(--mono);margin-left:auto;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%;text-align:right}
.src span{min-width:0}

/* mono key field */
.keyfield{position:relative}
.keyfield .input{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;padding-right:36px}
.keyfield .reveal{
  position:absolute;right:5px;top:50%;transform:translateY(-50%);
  width:26px;height:26px;display:grid;place-items:center;border:0;border-radius:6px;
  background:transparent;color:var(--fg-subtle);cursor:pointer;
}
.keyfield .reveal:hover{background:var(--bg-sunken);color:var(--fg)}
.keyfield .reveal svg{width:14px;height:14px}

/* ============================================================
   SHOWROOM sections
   ============================================================ */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g22{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}

.panel{
  background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;
  min-width:0;
}
.panel h3{font-size:13px;font-weight:650;margin-bottom:4px}
.panel > p{font-size:12px;color:var(--fg-muted);line-height:1.55}
.panel .sub{font-size:11px;color:var(--fg-subtle);margin-top:2px}

/* swatches */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-top:14px}
.sw-item{border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;background:var(--bg)}
.sw-item .chipc{height:52px}
.sw-item .meta2{padding:6px 9px;line-height:1.35}
.sw-item .meta2 b{display:block;font-size:11px;font-weight:600}
.sw-item .meta2 span{font-family:var(--mono);font-size:9.5px;color:var(--fg-subtle);text-transform:uppercase}

/* comparison */
.compare{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.shot{
  border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;background:var(--bg);
}
.shot .bar{
  display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);
  font-size:11px;font-weight:600;color:var(--fg-muted);background:var(--bg-sunken);
}
.shot .bar .b2{margin-left:auto;font-weight:500;font-size:10px;color:var(--fg-subtle);font-family:var(--mono)}
.shot img{display:block;width:100%;height:auto}
.shot.after .bar{background:var(--red-soft);color:var(--red-ink)}
.compare-pair{margin-bottom:22px}
.compare-pair h4{font-size:12.5px;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.compare-pair h4 .n{font-family:var(--mono);font-size:10px;color:var(--fg-subtle);border:1px solid var(--border);
  padding:1px 5px;border-radius:4px}

/* issues table */
.issue-list{display:flex;flex-direction:column;gap:0;border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--bg)}
.issue{display:grid;grid-template-columns:36px 1fr 1fr 84px;gap:14px;padding:12px 16px;border-bottom:1px solid var(--border);align-items:start;font-size:12px}
.issue:last-child{border-bottom:0}
.issue .n{font-family:var(--mono);font-size:10.5px;color:var(--fg-subtle);padding-top:2px}
.issue .what b{display:block;font-weight:600;font-size:12px;margin-bottom:2px}
.issue .what span{color:var(--fg-muted);line-height:1.5;font-size:11.5px}
.issue .fix{color:var(--fg-muted);line-height:1.5;font-size:11.5px}
.issue .fix b{color:var(--fg);font-weight:600}
.issue .sev{justify-self:end}
.issue-h{display:grid;grid-template-columns:36px 1fr 1fr 84px;gap:14px;padding:9px 16px;background:var(--bg-sunken);
  border-bottom:1px solid var(--border);font-size:10.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-subtle)}

/* icon grid */
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:8px}
.ic{
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 10px;
  border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg);
  transition:.14s;cursor:default;
}
.ic:hover{border-color:var(--red);background:var(--red-soft)}
.ic:hover svg{color:var(--red-ink)}
.ic svg{width:22px;height:22px;color:var(--fg-muted);stroke-width:1.7;transition:.14s}
.ic span{font-size:9.5px;color:var(--fg-subtle);font-family:var(--mono);text-align:center;word-break:break-word}
.scale-row{display:flex;align-items:flex-end;gap:22px;padding:16px;border:1px dashed var(--border);border-radius:var(--r-md);margin-top:12px}
.scale-row .s{display:flex;flex-direction:column;align-items:center;gap:6px}
.scale-row .s span{font-size:9.5px;font-family:var(--mono);color:var(--fg-subtle)}
.scale-row .s svg{color:var(--fg)}

/* logo concepts */
.logo-card{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 18px;text-align:center}
.logo-card .big{width:112px;height:112px;border-radius:26px;overflow:hidden;box-shadow:var(--sh-3)}
.logo-card .big svg{display:block;width:100%;height:100%}
.logo-card b{font-size:12.5px;font-weight:650}
.logo-card p{font-size:11px;color:var(--fg-muted);line-height:1.5;max-width:220px}
.logo-card .sizes{display:flex;align-items:center;gap:10px;margin-top:2px}
.logo-card .sizes svg{border-radius:5px}
.pick{outline:2px solid var(--red);outline-offset:3px}

/* type scale */
.type-row{display:flex;align-items:baseline;gap:16px;padding:9px 0;border-bottom:1px dashed var(--border)}
.type-row:last-child{border-bottom:0}
.type-row .k{font-family:var(--mono);font-size:10px;color:var(--fg-subtle);flex:0 0 92px}
.type-row .d{font-size:10.5px;color:var(--fg-subtle);margin-left:auto;text-align:right}

/* misc */
.split-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.split-h h3{font-size:12.5px;font-weight:650}
.split-h .r{margin-left:auto;display:flex;gap:8px;align-items:center}
hr.sep{border:0;border-top:1px solid var(--border);margin:20px 0}
.err{color:var(--red)}
.ok{color:var(--green)}
.kbd{
  font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:4px;
  border:1px solid var(--border-strong);border-bottom-width:2px;background:var(--bg-sunken);color:var(--fg-muted);
}
.footer{margin-top:60px;padding-top:22px;border-top:1px solid var(--border);display:flex;gap:16px;flex-wrap:wrap;
  font-size:11px;color:var(--fg-subtle)}
.footer b{color:var(--fg-muted);font-weight:600}

@media (max-width:1180px){
  .b-2,.b-split,.g22{grid-template-columns:minmax(0,1fr)}
  .b-4,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .compare{grid-template-columns:minmax(0,1fr)}
  .issue,.issue-h{grid-template-columns:28px 1fr 84px}
  .issue .fix,.issue-h .fixh{display:none}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .g2,.g3,.b-3{grid-template-columns:minmax(0,1fr)}
  .hero h1{font-size:32px}
  .topbar nav{display:none}
  .shell{padding:0 14px 60px}
}


/* heat scale (theme-aware) */
.h0{background:var(--bg-sunken);color:var(--fg-subtle)}
.h1{background:rgba(200,30,51,.10);color:var(--fg)}
.h2{background:rgba(200,30,51,.20);color:var(--fg)}
.h3{background:rgba(200,30,51,.34);color:var(--fg)}
.h4{background:rgba(200,30,51,.56);color:#fff}
.h5{background:rgba(200,30,51,.80);color:#fff}
.h6{background:rgba(200,30,51,1);color:#fff}
[data-theme="dark"] .h0{background:#14141A;color:#6F6F7C;border-color:rgba(255,255,255,.04)}
[data-theme="dark"] .h1{background:#1F1519;color:#C9C9D2}
[data-theme="dark"] .h2{background:#3A1820;color:#F4F4F6}
[data-theme="dark"] .h3{background:#5C1A26;color:#F4F4F6}
[data-theme="dark"] .h4{background:#8A1B2C;color:#FFFFFF}
[data-theme="dark"] .h5{background:#C01F35;color:#FFFFFF}
[data-theme="dark"] .h6{background:#FF3B4E;color:#1A0206}
[data-theme="dark"] .heat .cell.top{box-shadow:inset 0 0 0 1.5px var(--red), 0 0 0 3px var(--red-soft)}

/* histogram */
.hist{display:flex;align-items:flex-end;gap:4px;height:88px;margin-top:6px}
.hist .b{flex:1;background:var(--red);border-radius:3px 3px 0 0;opacity:.5;min-height:2px;transition:.15s}
.hist .b:hover{opacity:1}
.hist.axis{height:auto;margin-top:4px}
.hist.axis .b{height:auto;background:transparent;opacity:1;font-size:8.5px;color:var(--fg-subtle);text-align:center;font-variant-numeric:tabular-nums}

/* stepper */
.stepper{display:flex;align-items:center;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--bg);height:34px;overflow:hidden;width:100%}
.stepper button{width:32px;height:100%;border:0;background:transparent;color:var(--fg-muted);cursor:pointer;display:grid;place-items:center}
.stepper button:hover{background:var(--bg-sunken);color:var(--fg)}
.stepper button svg{width:13px;height:13px;stroke-width:2.2}
.stepper span{flex:1;text-align:center;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}

/* layout preview strip */
.wire{display:grid;grid-template-columns:132px 1fr;gap:8px;border:1px solid var(--border);border-radius:var(--r-md);padding:8px;background:var(--bg-sunken)}
.wire .col{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px;display:flex;flex-direction:column;gap:4px}
.wire .l{height:5px;border-radius:3px;background:var(--border)}
.wire .l.w60{width:60%}.wire .l.w40{width:40%}.wire .l.w80{width:80%}
.wire .l.red{background:var(--red);opacity:.65}
.wire .bx{flex:1;border:1px dashed var(--border-strong);border-radius:4px}

/* Sidebar experiment: keep the approved pages and tokens intact. */
body { min-width:600px; }
.preview-head { display:flex; align-items:center; gap:12px; height:66px; padding:0 24px; }
.preview-head > img { width:28px; height:28px; border-radius:7px; }
.preview-head strong { font-size:13px; font-weight:650; }
.preview-head .note { color:var(--fg-subtle); font-size:11.5px; }
.preview-head .right { margin-left:auto; display:flex; align-items:center; gap:10px; }
.preview-head .btn { height:30px; font-size:11.5px; }
.app { margin:0 20px 18px; height:calc(100vh - 84px); min-height:590px;
  grid-template-rows:40px minmax(0,1fr); grid-template-columns:236px minmax(0,1fr);
  transition:grid-template-columns 220ms cubic-bezier(.2,.7,.2,1); }
.app.is-collapsed { grid-template-columns:68px minmax(0,1fr); }
.titlebar { height:40px; }
.main { min-height:0; }
.topline, .statusbar { flex-shrink:0; }
.canvas { overflow:auto; min-height:0; scrollbar-gutter:stable; }
.rail { display:flex; min-height:0; padding:18px 12px 14px; }
.brand { min-height:58px; overflow:hidden; }
.brand > img { width:30px; height:30px; flex:0 0 30px; border-radius:8px; }
.brand .bt { white-space:nowrap; }
.nav button { position:relative; white-space:nowrap; flex-shrink:0; height:38px; }
.nav button > span { transition:opacity 120ms ease; }
.nav button > span:not(.count) { overflow:hidden; }
.nav button:focus-visible, #sidebarToggle:focus-visible, .sw:focus-visible {
  outline:2px solid var(--red); outline-offset:3px; }
.nav button.on::before { left:-12px; }
.sidebar-toggle { width:32px; height:32px; flex:0 0 32px; padding:0; margin-right:2px;
  background:transparent; border-color:transparent; color:var(--fg-muted); box-shadow:none; }
.sidebar-toggle:hover { background:var(--bg-sunken); border-color:var(--border); color:var(--fg); }
.sidebar-toggle svg { width:18px; height:18px; }

/* Gradient study. Keep the approved content, interactions and red identity. */
:root {
  --sans:"Segoe UI Variable Text","Segoe UI",Arial,sans-serif;
  --fg-subtle:#6F6D7A;
  --study-hero:linear-gradient(125deg,#FFF7F7 0%,#FFFFFF 45%,#F5F2F6 100%);
  --study-card:linear-gradient(145deg,#FFFFFF 5%,#FFFFFF 48%,#F5F4F8 100%);
  --study-edge:linear-gradient(145deg,#FFFFFF 0%,#E4DCE3 40%,#DFDFE8 100%);
  --study-glow:rgba(205,35,64,.09);
  --study-cta:linear-gradient(120deg,#D9324C 0%,#C71D38 55%,#A5122E 100%);
  --study-active:linear-gradient(100deg,#F8DFE5 0%,#FBEDEF 70%,#FFF6F7 100%);
  --study-shadow:0 5px 18px -12px rgba(44,21,37,.22),inset 0 1px 0 rgba(255,255,255,.95);
}
[data-theme="dark"] {
  --fg-subtle:#9A96A7; --fg-muted:#B3AFBE;
  --study-hero:linear-gradient(128deg,#2A1924 0%,#19151E 40%,#12131B 100%);
  --study-card:linear-gradient(140deg,#1B1A24 0%,#14141C 48%,#101117 100%);
  --study-edge:linear-gradient(140deg,#4B3544 0%,#34303F 37%,#24252E 100%);
  --study-glow:rgba(231,52,87,.13);
  --study-cta:linear-gradient(115deg,#FF7385 0%,#FF4D67 50%,#F23554 100%);
  --study-active:linear-gradient(100deg,#481E2B 0%,#2A1721 70%,#1F151D 100%);
  --study-shadow:0 7px 24px -14px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.035);
}
body { min-width:600px; }
.preview-head { height:72px; padding:0 26px; gap:11px; }
.preview-head > img { width:30px; height:30px; }
.preview-head strong { font-size:14px; letter-spacing:-.02em; }
.preview-head .note { font-size:11px; }
.preview-head .right { gap:12px; }
.study-tabs { display:flex; align-items:center; padding:3px; gap:2px; border:1px solid var(--border);
  border-radius:10px; background:var(--bg-sunken); }
.study-tabs button { border:0; border-radius:7px; padding:6px 12px; font:inherit; font-size:11px;
  font-weight:550; color:var(--fg-muted); background:transparent; cursor:pointer; }
.study-tabs button[aria-pressed="true"] { background:var(--bg-elevated); color:var(--fg); box-shadow:var(--sh-1); }
.study-tabs button:focus-visible { outline:2px solid var(--red); outline-offset:2px; }
.app { height:calc(100vh - 92px); margin-bottom:20px; }
.pagehead h1 { font-size:23px; font-weight:650; letter-spacing:-.035em; }
.pagehead p { font-size:12px; }
.pagehead { margin-bottom:2px; }
.preview-head .btn { gap:7px; }
#railMode { display:none; }
.study-swatch { display:inline-block; width:12px; height:12px; border-radius:50%;
  background:var(--study-cta); box-shadow:inset 0 0 0 1px rgba(255,255,255,.15); }
.study-meta { font-size:10px; color:var(--fg-subtle); }
.brand { gap:8px; height:50px; min-height:50px; }
.brand .bt { flex:1; }
.brand .sidebar-toggle { margin:0; }
.app.is-collapsed .brand { justify-content:center; padding-left:0; padding-right:0; }
.app.is-collapsed .brand > img { display:none; }

[data-finish="gradient"] body {
  background:radial-gradient(ellipse at 10% 0%,var(--study-glow),transparent 40%),var(--page);
}
[data-finish="gradient"] .app {
  border-color:transparent;
  background:linear-gradient(var(--bg),var(--bg)) padding-box,var(--study-edge) border-box;
  box-shadow:0 18px 58px -30px rgba(30,10,28,.30),0 1px 3px rgba(30,10,28,.06);
}
[data-theme="dark"][data-finish="gradient"] .app {
  box-shadow:0 22px 64px -28px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.025);
}
[data-finish="gradient"] .main {
  background:radial-gradient(ellipse at 80% -10%,var(--study-glow),transparent 53%),
    linear-gradient(160deg,var(--bg-sunken),var(--page));
}
[data-finish="gradient"] .titlebar {
  background:linear-gradient(100deg,var(--bg-sunken),var(--bg-elevated));
}
[data-finish="gradient"] .rail {
  background:linear-gradient(175deg,var(--bg) 0%,var(--bg) 65%,var(--red-soft) 170%);
}
[data-finish="gradient"] .topline {
  background:linear-gradient(105deg,var(--bg) 30%,var(--bg-elevated) 100%);
}
[data-finish="gradient"] .card {
  background:var(--study-card) padding-box,var(--study-edge) border-box;
  border:1px solid transparent; box-shadow:var(--study-shadow); border-radius:14px;
}
[data-finish="gradient"] .card.result-hero {
  background:var(--study-hero) padding-box,var(--study-edge) border-box;
}
[data-finish="gradient"] .result-hero .card-h .ico {
  background:linear-gradient(135deg,var(--red-soft),var(--gold-soft)); color:var(--red-ink);
}
[data-finish="gradient"] .nav button.on {
  background:var(--study-active); box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
}
[data-finish="gradient"] .nav button.on::before {
  background:linear-gradient(180deg,var(--red-bright),var(--red));
}
[data-finish="gradient"] .btn-primary {
  background:var(--study-cta); border-color:transparent;
  box-shadow:0 7px 16px -9px rgba(200,30,51,.62),inset 0 1px 0 rgba(255,255,255,.18);
  color:#FFFFFF;
}
[data-theme="dark"][data-finish="gradient"] .btn-primary { color:#18050B; }
[data-finish="gradient"] .btn-primary:hover { filter:brightness(.95); border-color:transparent; }
[data-theme="dark"][data-finish="gradient"] .btn-primary:hover { filter:brightness(1.04); }
[data-finish="gradient"] .card-h .ico {
  background:linear-gradient(135deg,var(--red-soft),var(--bg-elevated));
}
[data-finish="gradient"] .meter i,
[data-finish="gradient"] .statusbar .bar i { background:var(--study-cta); }
[data-finish="gradient"] .meter i.dim { background:var(--border-strong); }
[data-finish="gradient"] .ball {
  background:linear-gradient(150deg,#FFFFFF 12%,#F5F2F6 55%,#E9E6EE 100%);
  border-color:#E4DEE7;
  box-shadow:inset 0 1px 0 #FFFFFF,0 3px 7px -4px rgba(35,16,29,.2);
}
[data-theme="dark"][data-finish="gradient"] .ball {
  background:linear-gradient(145deg,#35313E 0%,#24232D 47%,#16171F 100%);
  border-color:#45404F;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 3px 8px -3px rgba(0,0,0,.6);
}
[data-finish="gradient"] .ball--hit {
  background:linear-gradient(135deg,#DB3851,#C01A36 65%,#A8122D); border-color:transparent; color:white;
}
[data-theme="dark"][data-finish="gradient"] .ball--hit {
  background:linear-gradient(135deg,#FF7C8D,#FF4D67 60%,#F23554); border-color:transparent; color:#18050B;
}
[data-finish="gradient"] .ball--gold {
  background:linear-gradient(140deg,#FBE8BF,#EEC77C 52%,#D39B3F); color:#3A2705; border-color:transparent;
}
[data-finish="gradient"] .badge.red {
  background:linear-gradient(125deg,var(--red-soft),var(--bg-elevated));
  border-color:var(--red-soft);
}
[data-finish="gradient"] .tblwrap {
  background:var(--study-card) padding-box,var(--study-edge) border-box; border-color:transparent;
  box-shadow:var(--study-shadow);
}
[data-finish="gradient"] .tbl th,
[data-finish="gradient"] .tblfoot {
  background:linear-gradient(110deg,var(--bg-sunken),var(--bg-elevated));
}
[data-finish="gradient"] .callout.info {
  background:linear-gradient(115deg,var(--bg-sunken),var(--bg-elevated));
}
[data-finish="gradient"] .seg { background:linear-gradient(145deg,var(--bg-sunken),var(--page)); }
[data-finish="gradient"] .chip.on { background:var(--study-cta); border-color:transparent; }
[data-theme="dark"][data-finish="gradient"] .chip.on { color:#18050B; }
[data-finish="gradient"] .answer {
  background:linear-gradient(150deg,var(--bg-sunken),var(--bg));
}
[data-finish="gradient"] .hist .b {
  background:linear-gradient(0deg,var(--red),var(--red-bright)); opacity:.7;
}
[data-finish="gradient"] .heat .cell {
  background-image:linear-gradient(150deg,rgba(255,255,255,.055),transparent 75%);
}
[data-theme="dark"][data-finish="gradient"] .heat .cell.h0 { color:var(--fg-subtle); }
[data-theme="light"][data-finish="gradient"] .heat .cell.h4,
[data-theme="light"][data-finish="gradient"] .heat .cell.h5 { color:#18050B; }
[data-finish="gradient"] .stat .val { letter-spacing:-.04em; }
[data-finish="gradient"] .result-hero hr { border-color:var(--border); opacity:.75; }
[data-finish="gradient"] .statusbar { background:linear-gradient(100deg,var(--bg),var(--bg-elevated)); }
@media(max-width:1100px) { .study-meta { display:none; } .preview-head { padding:0 22px; } }
@media(max-width:760px) { .preview-head .note { display:none; } .preview-head .right { gap:6px; } .study-tabs button { padding:6px 8px; } }
@media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }

</style>

function svg(name, cls){
  return `<svg class="${cls||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[name]||''}</svg>`;
}
const pad = n => String(n).padStart(2,"0");
const nf  = n => n.toLocaleString("vi-VN");
function balls(nums, cls, extra){
  return `<div class="balls ${extra||''}">${nums.map(n=>`<span class="ball ${cls||''}">${pad(n)}</span>`).join("")}</div>`;
}

function renderNav(){
  document.getElementById("nav").innerHTML = PAGES.map(p=>{
    const b = typeof p.badge==="function" ? p.badge() : p.badge;
    return `<button data-page="${p.id}" class="${S.page===p.id?"on":""}">
      ${svg(p.icon)}<span>${p.label}</span>${b?`<span class="count">${b}</span>`:""}
    </button>`;
  }).join("");
  document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{
    S.page=b.dataset.page; renderNav(); renderPage();
  });
}
function renderGameDrop(){
  document.getElementById("gameDrop").innerHTML = GAMES.map(g=>{
    const d = DB[g.id]?.draws ?? 0;
    return `<button data-g="${g.id}" class="${S.game===g.id?"sel":""}">
      ${svg(g.math?"grid":"layers")}<span>${g.name}</span>
      <small>${d?d+" kỳ":(g.math?"0 kỳ":"chưa bật")}</small>
    </button>`;
  }).join("");
  document.querySelectorAll("#gameDrop button").forEach(b=>b.onclick=()=>{
    S.game=b.dataset.g;
    const gm = gameMeta(S.game);
    document.getElementById("gameBtnLabel").textContent = gm.name;
    document.getElementById("gameBtnCount").textContent = (DB[S.game]?.draws ?? 0);
    document.getElementById("ctxGame").textContent = gm.name;
    document.getElementById("ctxMeta").textContent = "· " + ((DB[S.game]?.draws ?? 0) ? DB[S.game].draws+" kỳ đã lưu" : "chưa có dữ liệu");
    document.getElementById("gameDrop").classList.remove("open");
    renderNav(); renderPage();
  });
}

function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit",year:"numeric"});
}

/* ============================================================
   PAGE: STATS
   ============================================================ */
function pgStats(){
  const c = cur(), gm = gameMeta(S.game);
  if(!c.draws) return emptyPage("Chưa có dữ liệu thống kê", "Cần ít nhất một kỳ đã lưu để tính tần suất.");
  const entries = Object.entries(c.freq).map(([n,v])=>({n:+n,v}));
  const max = Math.max(...entries.map(e=>e.v));
  const min = Math.min(...entries.map(e=>e.v));
  const mean = entries.reduce((s,e)=>s+e.v,0)/entries.length;
  const hot = entries.filter(e=>e.v>=mean+2).sort((a,b)=>b.v-a.v).slice(0,3);
  const heat = entries.map(e=>{
    const t = max===min?0:(e.v-min)/(max-min);
    const lvl = Math.min(6, Math.max(0, Math.round(t*6)));
    return `<div class="cell h${lvl} ${e.v>=mean+2?"top":""}" title="Số ${pad(e.n)} · ${e.v} lần">
      <b>${pad(e.n)}</b><span>${e.v}</span></div>`;
  }).join("");
  return head("Thống kê xuất hiện","Tần suất, kỳ vọng và khoảng tin cậy 95% (Wilson) từ dữ liệu đã lưu.",
      `<div class="seg">
        <button class="${S.window===90?"on":""}" data-w="90">90 kỳ</button>
        <button class="${S.window===30?"on":""}" data-w="30">30 kỳ</button>
        <button class="${S.window===0?"on":""}" data-w="0">Toàn bộ</button>
      </div>`)
  + `<div class="bento b-3">
      <div class="card stat"><div class="lbl">Kỳ trong mẫu</div><div class="val">${c.count}</div>
        <div class="delta">phạm vi: ${S.window?S.window+" kỳ gần nhất":"toàn bộ"}</div></div>
      <div class="card stat"><div class="lbl">Kỳ vọng mỗi số</div><div class="val">${mean.toFixed(2)}<small>lần</small></div>
        <div class="delta">theo luật: ${(c.expected||0).toFixed(2)}</div></div>
      <div class="card stat"><div class="lbl">Số nóng (≥ x̄+2)</div><div class="val">${hot.map(h=>pad(h.n)).join(" · ")||"—"}</div>
        <div class="delta up"><b>${hot.length}</b> số cao hơn trung bình ≥ 2 lần</div></div>
    </div>
    <div class="bento b-2">
      <div class="card">
        <div class="card-h"><div class="ico">${svg("grid")}</div><h3>Bản đồ nhiệt ${c.entries||entries.length} số</h3>
          <span class="hint">${c.count} kỳ · giá trị = số lần xuất hiện</span></div>
        <div class="heat">${heat}</div>
        <div class="legend">
          <span>Ít</span>
          <div style="display:flex;gap:3px">
            ${[0,1,2,3,4,5,6].map(i=>`<div class="sw2 h${i}"></div>`).join("")}
          </div>
          <span>Nhiều</span>
          <span style="margin-left:12px;display:flex;align-items:center;gap:5px">
            <span class="sw2" style="box-shadow:inset 0 0 0 1.5px var(--red);background:transparent"></span> lệch cao
          </span>
        </div>
      </div>
      <div class="card">
        <div class="card-h"><div class="ico">${svg("stats")}</div><h3>Phân bố tần suất</h3></div>
        <div class="hist">
          ${(()=>{const bins=new Array(10).fill(0);
            entries.forEach(e=>{const lo=Math.floor(min), step=(max-min+1)/10; bins[Math.min(9,Math.floor((e.v-lo)/step))]++;});
            const bmax=Math.max(...bins);
            return bins.map(b=>`<div class="b" style="height:${(b/bmax*100).toFixed(0)}%" title="${b} số"></div>`).join("")})()}
        </div>
        <div style="display:flex;justify-content:space-between;font-size:9.5px;color:var(--fg-subtle);margin-top:5px">
          <span>${min} lần</span><span>${max} lần</span>
        </div>
        <hr class="sep">
        <div class="kv">
          <div class="r2"><div class="k">Trung bình quan sát</div><div class="v">${mean.toFixed(2)} lần/số</div></div>
          <div class="r2"><div class="k">Kỳ vọng lý thuyết</div><div class="v">${(c.expected||0).toFixed(2)} lần/số</div></div>
          <div class="r2"><div class="k">Khoảng tin cậy</div><div class="v mono">Wilson 95%</div></div>
        </div>
        <div class="callout" style="margin-top:12px">${svg("warn")}
          <span>${c.note||"Khoảng cách bị cắt tại cuối mẫu."}</span></div>
      </div>
    </div>
    <div class="tblwrap">
      <div class="tblscroll" style="max-height:330px">
        <table class="tbl">
          <thead><tr><th style="width:70px">Số</th><th style="width:90px" class="r">Số lần</th>
            <th style="width:130px" class="r">Tỷ lệ quan sát</th><th style="width:110px" class="r">Kỳ vọng</th>
            <th style="width:170px" class="r">Khoảng tin cậy 95%</th><th></th></tr></thead>
          <tbody>${entries.sort((a,b)=>b.v-a.v).slice(0,14).map(e=>{
            const w = c.wilson?.[e.n]||[0,0];
            return `<tr><td><span class="ball ball--xs ball--hit">${pad(e.n)}</span></td>
              <td class="r num">${e.v}</td>
              <td class="r num">${(e.v/c.count*100).toFixed(2)}%</td>
              <td class="r num muted">${(c.expected||0).toFixed(2)}</td>
              <td class="r num muted">${(w[0]*100).toFixed(1)}% – ${(w[1]*100).toFixed(1)}%</td>
              <td style="width:90px"><div class="meter"><i style="width:${(e.v/max*100).toFixed(0)}%"></i></div></td></tr>`
          }).join("")}</tbody>
        </table>
      </div>
      <div class="tblfoot"><span>Sắp xếp theo số lần xuất hiện · ${entries.length} số</span></div>
    </div>`;
}

/* empty state */
function emptyPage(title, sub){
  return head(title, sub, btnP("Cập nhật lịch sử","refresh"))
  + `<div class="card"><div class="empty">
      <div class="ec">${svg("db")}</div>
      <h4>Chưa có dữ liệu</h4>
      <p>${sub}</p>
      <div style="display:flex;gap:8px;margin-top:4px">${btnP("Cập nhật lịch sử","refresh")}${btn("Nhập CSV","file")}</div>
    </div></div>`;
}

/* router */
function renderPage(){
  const R = {overview:pgOverview, history:pgHistory, stats:pgStats, odds:pgOdds,
             suggest:pgSuggest, verify:pgVerify, ai:pgAI};
  document.getElementById("page").innerHTML = (R[S.page]||pgOverview)();
  if(S.page === "overview") document.querySelector("#page .bento > .card")?.classList.add("result-hero");
  const gm = gameMeta(S.game);
  document.getElementById("statusLeft").textContent =
    `${gm.name} · ${(DB[S.game]?.draws ?? 0)} kỳ · ${PAGES.find(p=>p.id===S.page).label}`;
  // wire stats segmented control
  document.querySelectorAll(".seg button[data-w]").forEach(b=>b.onclick=()=>{
    S.window = +b.dataset.w; renderPage();
  });
  const rb = document.getElementById("revealBtn");
  if(rb) rb.onclick = ()=>{ S.revealed=!S.revealed; renderPage(); };
}

/* theme */
function setTheme(t){
  S.theme = t;
  document.documentElement.dataset.theme = t;
  document.getElementById("themeLabel").textContent = t==="dark" ? "Nền sáng" : "Nền tối";
  const sw = document.getElementById("sw");
  if(sw) sw.setAttribute("aria-checked", t==="dark");
}
document.getElementById("themeBtn").onclick = ()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
document.getElementById("sw").onclick = ()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
document.addEventListener("keydown", e=>{
  if(!e.target.closest("input,textarea,select,[contenteditable]") && (e.key==="t"||e.key==="T")) setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
});
const gb = document.getElementById("gameBtn");
gb.onclick = e=>{ e.stopPropagation(); document.getElementById("gameDrop").classList.toggle("open"); };
document.addEventListener("click", e=>{
  if(!e.target.closest("#gameDrop") && !e.target.closest("#gameBtn"))
    document.getElementById("gameDrop").classList.remove("open");
});

/* top nav active state */
document.querySelectorAll(".topbar nav a").forEach(a=>a.onclick=()=>{
  document.querySelectorAll(".topbar nav a").forEach(x=>x.classList.remove("on"));
  a.classList.add("on");
});

/* init */
document.getElementById("ctxGame").textContent = gameMeta(S.game).name;


renderNav(); renderGameDrop(); renderPage();

const frame = document.getElementById('appFrame');
const rail = frame.querySelector('.rail');
rail.id = 'sidebar'; rail.setAttribute('aria-label', 'Điều hướng chính');
const logo = rail.querySelector('.brand > svg');
logo.outerHTML = '<img src="../assets/generated/07-ticket-gold.png" alt="">';
const toggle = document.createElement('button');
toggle.id = 'sidebarToggle'; toggle.type = 'button'; toggle.className = 'btn sidebar-toggle';
toggle.setAttribute('aria-controls', 'sidebar');
rail.querySelector('.brand').append(toggle);
const tooltip = document.createElement('div');
tooltip.id = 'navTooltip'; tooltip.className = 'nav-tooltip'; tooltip.setAttribute('role', 'tooltip');
document.body.append(tooltip);

function hideNavTooltip() { tooltip.classList.remove('visible'); }
function setSidebarCollapsed(collapsed) {
  frame.classList.toggle('is-collapsed', collapsed);
  const label = collapsed ? 'Mở rộng thanh điều hướng' : 'Thu gọn thanh điều hướng';
  toggle.setAttribute('aria-expanded', String(!collapsed));
  toggle.setAttribute('aria-label', label); toggle.title = label;
  toggle.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'
    + '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/>'
     + '</svg>';
  document.getElementById('railMode').textContent = collapsed ? 'Sidebar 68px · thêm 168px nội dung' : 'Sidebar 236px';
  hideNavTooltip();
}
toggle.addEventListener('click', () => setSidebarCollapsed(!frame.classList.contains('is-collapsed')));

function decorateNav() {
  document.querySelectorAll('#nav button').forEach(button => {
    const page = PAGES.find(page => page.id === button.dataset.page);
    button.setAttribute('aria-label', page.label);
    if(button.classList.contains('on')) button.setAttribute('aria-current', 'page');
    else button.removeAttribute('aria-current');
  });
}
function showNavTooltip(event) {
  const button = event.target.closest('#nav button');
  if(!button || !frame.classList.contains('is-collapsed')) return;
  const badge = button.querySelector('.count');
  tooltip.textContent = button.getAttribute('aria-label') + (badge ? ' · ' + badge.textContent + ' kỳ' : '');
  const rect = button.getBoundingClientRect();
  tooltip.style.left = (rect.right + 18) + 'px';
  tooltip.style.top = (rect.top + rect.height / 2) + 'px';
  tooltip.classList.add('visible');
  button.setAttribute('aria-describedby', 'navTooltip');
}
const nav = document.getElementById('nav');
nav.addEventListener('pointerover', showNavTooltip);
nav.addEventListener('focusin', showNavTooltip);
nav.addEventListener('pointerleave', hideNavTooltip);
nav.addEventListener('focusout', hideNavTooltip);
nav.addEventListener('click', hideNavTooltip);
new MutationObserver(decorateNav).observe(nav, {childList:true});
window.addEventListener('resize', hideNavTooltip);
document.addEventListener('keydown', event => { if(event.key === 'Escape') hideNavTooltip(); });
const themeSwitch = document.getElementById('sw');
themeSwitch.tabIndex = 0; themeSwitch.setAttribute('aria-label', 'Giao diện tối');
themeSwitch.addEventListener('keydown', event => {
  if(event.key === 'Enter' || event.key === ' ') { event.preventDefault(); themeSwitch.click(); }
});
decorateNav(); setSidebarCollapsed(false);


function setFinish(finish) {
  document.documentElement.dataset.finish = finish;
  document.getElementById('flatBtn').setAttribute('aria-pressed', String(finish === 'flat'));
  document.getElementById('gradientBtn').setAttribute('aria-pressed', String(finish === 'gradient'));
}
document.getElementById('flatBtn').onclick = () => setFinish('flat');
document.getElementById('gradientBtn').onclick = () => setFinish('gradient');
setTheme('dark');

</script>
